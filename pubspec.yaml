name: app_universitaria
description: "EstudiApp — Organizador académico con IA para universitarios."
publish_to: 'none'

version: 1.8.4+80

environment:
  sdk: ^3.6.2

dependencies:
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^19.5.0
  firebase_core: ^4.5.0
  cloud_firestore: ^6.1.3
  firebase_auth: ^6.2.0
  google_sign_in: 6.2.1
  google_mobile_ads: ^6.0.0
  http: ^1.6.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  pdf: ^3.11.0
  printing: ^5.13.1
  path_provider: ^2.1.4
  cloud_functions: 6.0.7
  shared_preferences: ^2.3.3
  android_intent_plus: ^6.0.0
  connectivity_plus: ^7.1.1
  share_plus: ^10.1.4
  hive_flutter: ^1.1.0
  home_widget: ^0.7.0
  flutter_secure_storage: ^9.2.2
  flutter_launcher_icons: ^0.14.4
  in_app_purchase: ^3.2.0
  firebase_messaging: ^16.1.2
  firebase_crashlytics: ^5.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icono_estudiapp.png"